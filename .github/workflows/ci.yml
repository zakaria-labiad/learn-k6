name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Run unit tests
        run: make test

      - name: Start application
        run: |
          make start &
          sleep 5

      - name: Check application
        run: curl -f http://127.0.0.1:3000/api/cubes

      - name: Check k6 files
        run: |
          pwd
          ls -la
          ls -la scripts

      - name: Run k6
        env:
          K6_HOST: http://127.0.0.1
          PORT: 3000
          K6_VUS: 10
          K6_DURATION: 10s
        run: make k6

      - name: Performance test failed
        if: steps.k6_test.outcome == 'failure'
        run: |
          echo "Not good and it will not be deploy"
          exit 1

      - name: Deploy
        if: steps.k6_test.outcome == 'success'
        run: echo "Good and it will be deploy"
